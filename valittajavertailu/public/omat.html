<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Omat kohteet | Välittäjävertailu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Välittäjä<span>vertailu</span></a>
      <nav class="nav">
        <a href="/valittaja">Välittäjille</a>
        <a class="btn" href="/kilpailuta">Kilpailuta välittäjät</a>
      </nav>
    </div>
  </header>
  <main class="narrow">
    <form id="login" class="form-card" novalidate hidden>
      <h1 class="step-title">Omat myyntikohteet</h1>
      <p>Anna sähköpostiosoite, jolla jätit myyntikohteen. Lähetämme kirjautumislinkin, joka on voimassa 30 minuuttia.</p>
      <div class="field" data-field="email"><label for="email">Sähköposti</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-actions"><span></span><button class="btn" type="submit">Lähetä kirjautumislinkki</button></div>
      <div id="login-result" role="status"></div>
    </form>
    <div id="app" class="stack" hidden></div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <div>© Välittäjävertailu – kiinteistönvälittäjien kilpailutus</div>
      <div><a href="/valittajille">Välittäjille</a> · <a href="/oppaat">Oppaat</a> · <a href="/kayttoehdot">Käyttöehdot</a> · <a href="/tietosuoja">Tietosuoja</a></div>
    </div>
  </footer>
  <script type="module" src="/omat.js"></script>
</body>
</html>
