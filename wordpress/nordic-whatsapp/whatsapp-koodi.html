<!-- WhatsApp-chat: Myynti + Asennus (ikkunakauppias.fi)
     Liitä koko koodi sivuston alatunnisteeseen (esim. WPCode → Footer).
     Muokkaa vain alla olevaa ASETUKSET-kohtaa. -->
<style>
/* Nordic WhatsApp */
.nwa { --nwa-green: #25D366; --nwa-dark: #128C4A; --nwa-spruce: #16303B; --nwa-ink2: #3D5561; --nwa-line: rgba(22, 48, 59, .12);
  --nwa-bottom: 20px; position: fixed; left: 20px; bottom: var(--nwa-bottom); z-index: 9989;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.45; transition: bottom .3s; }
.nwa *, .nwa *::before, .nwa *::after { box-sizing: border-box; }
.nwa-ico { width: 26px; height: 26px; flex: none; }
.nwa-launcher { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 20px 0 16px; border: 0; border-radius: 999px;
  background: var(--nwa-green); color: #fff; font: 600 15px/1 inherit; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 30px rgba(18, 140, 74, .35); transition: transform .3s cubic-bezier(.22, 1, .36, 1), box-shadow .3s; }
.nwa-launcher:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(18, 140, 74, .42); }
.nwa-launcher:focus-visible, .nwa a:focus-visible, .nwa button:focus-visible { outline: 3px solid #FFD866; outline-offset: 2px; }
.nwa-panel { position: absolute; left: 0; bottom: 66px; width: min(340px, calc(100vw - 28px)); padding: 16px; background: #fff;
  border: 1px solid var(--nwa-line); border-radius: 20px; box-shadow: 0 24px 60px rgba(16, 37, 48, .25); animation: nwaIn .3s cubic-bezier(.22, 1, .36, 1); }
.nwa-panel[hidden] { display: none; }
@keyframes nwaIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.nwa-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
.nwa-title { margin: 0; font: 700 16px/1.2 'Space Grotesk', 'Inter', sans-serif; color: var(--nwa-spruce); }
.nwa-close { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #EBF1F3; color: var(--nwa-spruce); cursor: pointer; font-size: 18px; line-height: 1; }
.nwa-option, .nwa-inline-btn { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 8px; border: 1px solid var(--nwa-line); border-radius: 14px;
  text-decoration: none !important; color: var(--nwa-spruce) !important; background: #fff; transition: border-color .2s, background-color .2s, transform .2s; }
.nwa-option:hover, .nwa-inline-btn:hover { border-color: var(--nwa-green); background: #F1FBF4; transform: translateY(-1px); }
.nwa-option .nwa-ico, .nwa-inline-btn .nwa-ico { color: var(--nwa-dark); width: 30px; height: 30px; }
.nwa-option strong, .nwa-inline-btn strong { display: block; font-size: 15px; }
.nwa-option small, .nwa-inline-btn small { display: block; font-size: 13px; color: var(--nwa-ink2); }
.nwa-hours { margin: 12px 2px 0; font-size: 12.5px; color: #647A84; }
.nwa-inline { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
.nwa-inline-btn { margin: 0; flex: 1 1 240px; }
@media (max-width: 760px) {
  .nwa { left: 14px; --nwa-bottom: 14px; }
  body:has(.sticky-cta.is-visible) .nwa { --nwa-bottom: 84px; }
}
@media (max-width: 420px) {
  .nwa-launcher { width: 56px; height: 56px; padding: 0; justify-content: center; }
  .nwa-launcher span { display: none; }
}
/* Kun Kysy meiltä -ikkuna on auki mobiilissa koko näytöllä, WhatsApp-painike piiloon */
@media (max-width: 520px) { html.nfaq-open .nwa { display: none; } }
@media print { .nwa { display: none; } }
@media (prefers-reduced-motion: reduce) { .nwa * { animation: none !important; transition: none !important; } }
</style>
<script>
/* ===== ASETUKSET – muokkaa tätä kohtaa ===== */
window.NordicWA = {
  button: 'WhatsApp',
  hours: 'Vastaamme arkisin klo 8–17.',
  contacts: [
    { key: 'sales', label: 'Myynti',  desc: 'Tarjoukset, tuotteet ja mittauskäynnit',
      num: '045 7832 5070', text: 'Hei! Haluaisin kysyä ikkunoista tai ovista.' },
    { key: 'inst',  label: 'Asennus', desc: 'Asennusaikataulut ja asennuspäivän asiat',
      num: '045 7830 4746', text: 'Hei! Minulla on kysymys asennuksesta.' }
  ]
};
/* ===== Asetukset loppuu – älä muokkaa tämän alapuolelta ===== */
/* Nordic WhatsApp: painike + valikko (Myynti / Asennus) */
(function () {
  'use strict';
  var cfg = window.NordicWA;
  if (!cfg || !cfg.contacts || !cfg.contacts.length) return;
  // Numero WhatsAppin muotoon: 050 123 4567 / +358 50 123 4567 → 358501234567
  cfg.contacts = cfg.contacts.map(function (c) {
    var n = String(c.num || '').replace(/[^0-9+]/g, '');
    if (n.charAt(0) === '+') n = n.slice(1); else if (n.slice(0, 2) === '00') n = n.slice(2); else if (n.charAt(0) === '0') n = '358' + n.slice(1);
    c.num = n; return c;
  }).filter(function (c) { return c.num; });
  if (!cfg.contacts.length) return;
  var ICON = '<svg class="nwa-ico" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 6.9L3 29l6.5-2c1.9 1 4.1 1.6 6.5 1.6 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.3c-2.1 0-4.1-.6-5.8-1.7l-.4-.2-3.9 1.2 1.2-3.7-.3-.4a10.4 10.4 0 0 1-1.7-5.7C5.1 10 10 5.3 16 5.3S26.9 10 26.9 15.8 22 26.3 16 26.3zm6-7.8c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.6 8.6 0 0 1-4.3-3.7c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3z"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function link(c) {
    // Aloitusviestiin sivu, jolta kävijä tulee, jotta tiedätte mistä on kyse
    var text = (c.text ? c.text + '\n\n' : '') + '(' + document.title.split(' – ')[0] + ': ' + location.href + ')';
    return 'https://wa.me/' + c.num + '?text=' + encodeURIComponent(text);
  }

  var root = document.createElement('div');
  root.className = 'nwa';
  var single = cfg.contacts.length === 1;
  var html = '<button class="nwa-launcher" type="button" aria-expanded="false" aria-controls="nwa-panel" aria-label="WhatsApp">' + ICON + '<span>' + esc(cfg.button || 'WhatsApp') + '</span></button>';
  if (!single) {
    html += '<div class="nwa-panel" id="nwa-panel" role="dialog" aria-label="WhatsApp" hidden><div class="nwa-head"><p class="nwa-title">Kenelle haluat kirjoittaa?</p><button class="nwa-close" type="button" aria-label="Sulje">&times;</button></div>';
    cfg.contacts.forEach(function (c) {
      html += '<a class="nwa-option" target="_blank" rel="noopener" data-nwa="' + esc(c.key) + '" href="' + esc(link(c)) + '">' + ICON + '<span><strong>' + esc(c.label) + '</strong><small>' + esc(c.desc) + '</small></span></a>';
    });
    html += (cfg.hours ? '<p class="nwa-hours">' + esc(cfg.hours) + '</p>' : '') + '</div>';
  }
  root.innerHTML = html;
  document.body.appendChild(root);

  var btn = root.querySelector('.nwa-launcher');
  var panel = root.querySelector('.nwa-panel');
  function setOpen(open) {
    if (!panel) return;
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () {
    if (single) {
      track(cfg.contacts[0].key);
      window.open(link(cfg.contacts[0]), '_blank', 'noopener');
      return;
    }
    setOpen(panel.hidden);
  });
  if (panel) panel.querySelector('.nwa-close').addEventListener('click', function () { setOpen(false); btn.focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-nwa]');
    if (a) { track(a.getAttribute('data-nwa')); setOpen(false); }
    else if (panel && !panel.hidden && !root.contains(e.target)) setOpen(false);
  });
  function track(key) { if (window.dataLayer) window.dataLayer.push({ event: 'whatsapp_click', whatsapp_target: key }); }
})();
</script>
