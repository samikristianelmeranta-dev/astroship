<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Ikkunakauppias.fi – hupparipainatukset</title>
<!--
  Painatukset läpinäkyvällä taustalla. Mitat millimetreinä (todellinen painokoko).
  Tummaan huppariin: valkoinen + keltainen, IKKUNAT & OVET on "kaiverrettu" keltaiseen raitaan
  (teksti on läpinäkyvää, eli siinä näkyy hupparin oma väri) → vain 2 painoväriä.
  Vaaleaan huppariin: tumma + keltainen.
  huppari-build.mjs tekee jokaisesta PDF:n (vektori) ja 300 dpi PNG:n.
-->
<style>
@font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk-Bold.ttf') format('truetype'); font-weight: 700; }
:root { --spruce: #16303B; --gold: #FFD866; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #8a8f93; display: flex; flex-wrap: wrap; gap: 30mm; padding: 30mm; align-items: flex-start; font-family: 'Space Grotesk', sans-serif; }
body.print { background: transparent; padding: 0; gap: 0; }
.print-item { flex: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.dark { --ink: #fff; --accent: var(--gold); }
.light { --ink: var(--spruce); --accent: var(--gold); }

/* Rintapaino: logo + nimi yhdellä rivillä */
.chest { display: flex; align-items: center; gap: 2.8mm; padding: 0; }
.chest svg.mark { width: 11.2mm; height: 11.2mm; flex: none; color: var(--ink); }
.chest .name { font-weight: 700; font-size: 10.6mm; letter-spacing: -0.02em; line-height: 1; color: var(--ink); white-space: nowrap; }
.chest .name b { color: var(--accent); }
.light.chest .name b { color: #1D5E79; }

/* Selkäpaino */
.back { width: 300mm; display: flex; flex-direction: column; align-items: center; }
.back svg.mark { width: 92mm; height: 92mm; color: var(--ink); margin-bottom: 14mm; }
.back .name { font-weight: 700; font-size: 37.5mm; letter-spacing: -0.02em; line-height: 1; color: var(--ink); white-space: nowrap; }
.back .name b { color: var(--accent); }
.light.back .name b { color: #1D5E79; }
.back svg.band { display: block; width: 300mm; height: 46mm; margin-top: 12mm; }
.back .tag { margin-top: 11mm; font-weight: 700; font-size: 13mm; letter-spacing: -0.01em; line-height: 1.15; color: var(--ink); text-align: center; }

/* Mallikuva */
.mock { width: 520mm; display: flex; gap: 20mm; background: #e9edef; padding: 20mm; border-radius: 10mm; }
.mock figure { position: relative; flex: 1; }
.mock figcaption { text-align: center; font-size: 12mm; color: #3D5561; margin-top: 4mm; }
.mock .hood { width: 100%; height: auto; display: block; }
.mock .place { position: absolute; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="logo" viewBox="0 0 24 24">
      <rect x="12" y="2" width="10" height="10" fill="#FFD866"/>
      <rect x="2.6" y="2.6" width="18.8" height="18.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1.6"/>
      <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <!-- Huppari-siluetti mallikuvaa varten (viewBox 200 x 230) -->
    <symbol id="hoodie" viewBox="0 0 200 230">
      <path d="M70 18 C78 6 122 6 130 18 L160 30 C176 36 184 48 188 66 L198 170 C199 178 194 182 187 182 L176 182 L170 96 L168 222 C168 226 165 228 161 228 L39 228 C35 228 32 226 32 222 L30 96 L24 182 L13 182 C6 182 1 178 2 170 L12 66 C16 48 24 36 40 30 Z"/>
    </symbol>
  </defs>
</svg>

<!-- Rintapaino tummaan huppariin (leveys n. 100 mm) -->
<div class="print-item chest dark" id="huppari-rinta-tumma">
  <svg class="mark"><use href="#logo"/></svg><span class="name">Ikkunakauppias<b>.fi</b></span>
</div>

<!-- Rintapaino vaaleaan huppariin -->
<div class="print-item chest light" id="huppari-rinta-vaalea">
  <svg class="mark"><use href="#logo"/></svg><span class="name">Ikkunakauppias<b>.fi</b></span>
</div>

  </svg>
  <p class="tag">Kotimaisuus &amp; ammattitaito<br>kulkee käsi kädessä.</p>
</div>

<!-- Selkäpaino vaaleaan huppariin -->
<div class="print-item back light" id="huppari-selka-vaalea">
  <svg class="mark"><use href="#logo"/></svg>
  <span class="name">Ikkunakauppias<b>.fi</b></span>
  <svg class="band" viewBox="0 0 300 46">
    <rect width="300" height="46" fill="#FFD866"/>
    <text x="150" y="23" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="31" letter-spacing="1.2" fill="#16303B">IKKUNAT &amp; OVET</text>
  </svg>

<!-- Mallikuva: edessä rintapaino, takana selkäpaino (vain esikatselu) -->
<div class="mock" id="huppari-mallikuva">
  <figure>
    <svg class="hood" viewBox="0 0 200 230" style="color:#16303B"><use href="#hoodie" fill="#1f2a30"/>
      <path d="M78 16 C86 40 114 40 122 16" fill="none" stroke="#11181c" stroke-width="2"/>
      <line x1="94" y1="34" x2="92" y2="70" stroke="#d9dde0" stroke-width="1.2"/><line x1="106" y1="34" x2="108" y2="70" stroke="#d9dde0" stroke-width="1.2"/>
      <path d="M62 160 L138 160 L146 205 L54 205 Z" fill="none" stroke="#11181c" stroke-width="1.6"/>
    </svg>
    <div class="place" data-src="huppari-rinta-tumma" style="left:57%;top:27%;width:12%"></div>
    <figcaption>Edessä: rintapaino 100 mm</figcaption>
  </figure>
  <figure>
    <svg class="hood" viewBox="0 0 200 230"><use href="#hoodie" fill="#1f2a30"/>
      <path d="M70 18 C80 46 120 46 130 18" fill="#192328" stroke="#11181c" stroke-width="2"/>
    </svg>
    <div class="place" data-src="huppari-selka-tumma" style="left:32%;top:22%;width:36%"></div>
    <figcaption>Takana: selkäpaino 300 mm</figcaption>
  </figure>
</div>

<script>
// Mallikuvaan kopioidaan varsinaiset painatukset pienennettyinä
document.querySelectorAll('.mock .place').forEach(function (p) {
  var src = document.getElementById(p.dataset.src).cloneNode(true);
  src.removeAttribute('id');
  src.style.width = 'max-content';
  src.querySelectorAll('[id]').forEach(function (n) { n.id = n.id + '-m'; });
  p.appendChild(src);
  requestAnimationFrame(function () {
    var w = src.getBoundingClientRect().width;
    src.style.transformOrigin = '0 0';
    src.style.transform = 'scale(' + (p.getBoundingClientRect().width / w) + ')';
  });
});
</script>
</body>
</html>
