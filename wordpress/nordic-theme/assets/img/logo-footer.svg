<svg width="320" height="64" viewBox="0 0 320 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700&amp;display=swap');
      .word { font-family: 'Poppins', sans-serif; font-weight: 700; }
