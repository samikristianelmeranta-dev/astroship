<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Flyer</title>
<style>
  @font-face { font-family: 'Bricolage'; font-weight: 200 800; src: url('assets/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Bricolage'; font-weight: 200 800; src: url('assets/fonts/bricolage-grotesque-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('assets/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('assets/fonts/inter-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }

  :root { --fuksia: #b3125d; --vaalea: #de3478; --sininen: #5d538c; --liila: #744668; --ink: #1d1934; --cream: #fbf3ea; --pinkki: #fbe4ee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  /* --u = 1 % flyerin leveydestä; kaikki mitat skaalautuvat sen mukana */
  body { --u: calc(var(--w) / 100); font-family: 'Inter', sans-serif; color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased; }
  .flyer { width: var(--w); height: var(--h); display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- yläosa: kuva ja pääviesti ---------- */
  .hero {
    position: relative; overflow: hidden; color: var(--cream); flex: 0 0 var(--hero, 36%);
    background:
      radial-gradient(ellipse 70% 70% at 85% 10%, rgba(222, 52, 120, .6), transparent 70%),
      radial-gradient(ellipse 60% 80% at 0% 100%, rgba(116, 70, 104, .9), transparent 70%),
      linear-gradient(150deg, var(--ink) 0%, #2b2552 50%, var(--sininen) 100%);
  }
  .ring { position: absolute; border-radius: 50%; border: calc(var(--u) * .5) solid rgba(251, 243, 234, .12); }
  .photo { position: absolute; z-index: 1; right: var(--ph-right, -6%); top: var(--ph-top, 6%); width: var(--ph-w, 43%); filter: drop-shadow(0 calc(var(--u) * 1.5) calc(var(--u) * 3) rgba(0,0,0,.45)); }
  .photo img { display: block; width: 100%; height: auto; }
  .lead { position: absolute; z-index: 2; left: 7%; top: 6.5%; width: var(--lead-w, 56%); display: flex; flex-direction: column; gap: calc(var(--u) * 2.4); }
  .eyebrow { align-self: flex-start; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: calc(var(--u) * 2.3); background: rgba(251,243,234,.14); padding: calc(var(--u) * .9) calc(var(--u) * 2); border-radius: 999px; }
  h1 { font-family: 'Bricolage', sans-serif; font-weight: 800; line-height: .98; letter-spacing: -.015em; font-size: calc(var(--u) * 7.2); }
  h1 em { font-style: normal; color: var(--vaalea); }
  .who { display: flex; flex-direction: column; gap: calc(var(--u) * .6); margin-top: calc(var(--u) * 1); }
  .name { font-family: 'Bricolage', sans-serif; font-weight: 800; text-transform: uppercase; line-height: .95; font-size: calc(var(--u) * 5.2); }
  .tag { font-weight: 600; font-size: calc(var(--u) * 2.9); color: rgba(251,243,234,.85); }

  /* ---------- keskiosa: teemat ---------- */
  .themes { flex: 1; min-height: 0; padding: calc(var(--u) * 3.8) 7% calc(var(--u) * 3.4); display: flex; flex-direction: column; justify-content: space-between; gap: calc(var(--u) * 2.4); }
  .themes h2 { font-family: 'Bricolage', sans-serif; font-weight: 800; font-size: calc(var(--u) * 4.4); line-height: 1.1; }
  .themes h2 span { color: var(--fuksia); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 2.2) calc(var(--u) * 4); }
  .item { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 2); align-items: start; }
  .ic { display: grid; place-items: center; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: calc(var(--u) * 1.6); background: var(--pinkki); color: var(--fuksia); }
  .ic svg { width: 55%; height: 55%; }
  .item h3 { font-family: 'Bricolage', sans-serif; font-weight: 800; font-size: calc(var(--u) * 2.75); line-height: 1.12; }
  .item p { margin-top: calc(var(--u) * .5); font-size: calc(var(--u) * 2); line-height: 1.38; color: #4d4763; }

  /* ---------- alaosa ---------- */
  .foot { flex: 0 0 auto; background: var(--ink); color: var(--cream); padding: calc(var(--u) * 2.6) 7% calc(var(--u) * 3.2); display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 4); position: relative; }
  .logo { width: calc(var(--u) * 20); height: auto; display: block; }
  .info { text-align: right; display: flex; flex-direction: column; gap: calc(var(--u) * .5); }
  .url { font-family: 'Bricolage', sans-serif; font-weight: 800; font-size: calc(var(--u) * 4); }
  .dates { font-size: calc(var(--u) * 2.1); font-weight: 600; color: rgba(251,243,234,.8); }
  .dates b { color: var(--vaalea); }
  .payer { position: absolute; left: 7%; bottom: calc(var(--u) * .8); font-size: calc(var(--u) * 1.15); color: rgba(251,243,234,.55); }

  /* ---------- tiivis (A6): vain otsikot ---------- */
  .compact { --hero: 47%; }
  .compact h1 { font-size: calc(var(--u) * 8.6); }
  .compact .item p { display: none; }
  .compact .item { align-items: center; gap: calc(var(--u) * 2.4); }
  .compact .item h3 { font-size: calc(var(--u) * 3.1); }
  .compact .ic { width: calc(var(--u) * 6.6); height: calc(var(--u) * 6.6); }
  .compact .themes { padding-top: calc(var(--u) * 4); padding-bottom: calc(var(--u) * 4); gap: calc(var(--u) * 2.6); }
  .compact .themes h2 { font-size: calc(var(--u) * 5); }
  .compact .grid { gap: calc(var(--u) * 2) calc(var(--u) * 3); }
  .compact .logo { width: calc(var(--u) * 22); }
  .compact .url { font-size: calc(var(--u) * 4.8); }
  .compact .dates { font-size: calc(var(--u) * 2.3); }
  .compact .payer { font-size: calc(var(--u) * 1.6); }
  .compact .eyebrow { font-size: calc(var(--u) * 2.8); }
  .compact .tag { font-size: calc(var(--u) * 3.4); }
  .compact .name { font-size: calc(var(--u) * 7); }

  /* ---------- DL (99 x 210): kapea, teemat allekkain ---------- */
  .dl { --hero: 40%; --ph-w: 56%; --ph-right: -12%; --ph-top: 46%; --lead-w: 86%; }
  .dl h1 { font-size: calc(var(--u) * 10.4); }
  .dl .eyebrow { font-size: calc(var(--u) * 3.4); }
  .dl .name { font-size: calc(var(--u) * 8.4); }
  .dl .tag { font-size: calc(var(--u) * 4.2); }
  .dl .who { width: 56%; }
  .dl .grid { grid-template-columns: 1fr; gap: calc(var(--u) * 1.3); }
  .dl .item p { display: none; }
  .dl .item { align-items: center; gap: calc(var(--u) * 3); }
  .dl .item h3 { font-size: calc(var(--u) * 3.9); }
  .dl .ic { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
  .dl .themes { padding-top: calc(var(--u) * 4.4); padding-bottom: calc(var(--u) * 4); gap: calc(var(--u) * 2.6); }
  .dl .themes h2 { font-size: calc(var(--u) * 5.4); }
  .dl .foot { flex-direction: column; align-items: center; text-align: center; gap: calc(var(--u) * 1.8); padding-top: calc(var(--u) * 3.4); padding-bottom: calc(var(--u) * 6); }
  .dl .info { text-align: center; }
  .dl .logo { width: calc(var(--u) * 24); }
  .dl .url { font-size: calc(var(--u) * 6.6); }
  .dl .dates { font-size: calc(var(--u) * 3.3); }
  .dl .payer { left: 0; right: 0; text-align: center; font-size: calc(var(--u) * 2); bottom: calc(var(--u) * 1.6); }
</style>
</head>
<body>
<div class="flyer">
  <section class="hero">
    <div class="ring" style="width:calc(var(--u)*90);height:calc(var(--u)*90);right:-30%;top:-25%"></div>
    <div class="ring" style="width:calc(var(--u)*60);height:calc(var(--u)*60);left:-25%;bottom:-30%"></div>
    <div class="photo"><img src="assets/sami.png" alt=""></div>
    <div class="lead">
      <span class="eyebrow">Eduskuntavaalit 2027</span>
      <h1>Olen ehdolla <em>eduskunta&shy;vaaleissa.</em></h1>
      <div class="who">
        <p class="name">Sami<br>Elmeranta</p>
        <p class="tag">Tolkun poliitikko · Kaarina</p>
      </div>
    </div>
  </section>

  <section class="themes">
    <h2>Näiden asioiden <span>puolesta teen töitä</span></h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="foot">
    <img class="logo" src="assets/liike-nyt-logo.png" alt="Liike Nyt">
    <div class="info">
      <p class="url">samielmeranta.fi</p>
      <p class="dates">Ennakkoäänestys 7.–13.4. · <b>Vaalipäivä su 18.4.2027</b></p>
    </div>
    <p class="payer">Maksaja: Sami Elmeranta</p>
  </footer>
</div>
<script>
  const themes = [
    ['briefcase', 'Työpaikat ja toimeentulo', 'Työ luo hyvinvointia ja turvaa arjen. Työn pitää aina kannattaa.'],
    ['rocket', 'Yrittäjyys sujuvaksi', 'Kun yrittäminen on sujuvaa, syntyy työtä, kasvua ja hyvinvointia.'],
    ['map', 'Elinvoimainen Varsinais-Suomi', 'Tehdään alueesta paikka, jossa on hyvä asua, elää ja yrittää.'],
    ['baby', 'Lapset ja nuoret', 'Panostus lapsiin on sijoitus tulevaisuuteen.'],
    ['heart-handshake', 'Aktiivinen eläkeikä', 'Jokaisella on oikeus merkitykselliseen elämään myös työuran jälkeen.'],
    ['globe', 'Maahanmuutto', 'Maahanmuuton tulee olla nettohyödyllistä ja tukea työllisyyttä.'],
    ['school', 'Kurinpalautus kouluihin', 'Turvallinen ja hallittu oppimisympäristö on oppimisen perusta.'],
    ['landmark', 'Perinteet kunniaan', 'Uudistutaan viisaasti ja säilytetään se, mikä toimii.'],
  ];
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--w', q.get('w') + 'px');
  document.documentElement.style.setProperty('--h', q.get('h') + 'px');
  if (q.get('layout')) document.body.classList.add(q.get('layout'));
  // Ikonit (lucide) tuodaan renderöijästä: assets/icons.json.
  const icons = window.__icons || {};
  const grid = document.getElementById('grid');
  for (const [ic, title, text] of themes) {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[ic] || ''}</svg></span><div><h3></h3><p></p></div>`;
    d.querySelector('h3').textContent = title;
    d.querySelector('p').textContent = text;
    grid.appendChild(d);
  }
</script>
</body>
</html>
